name: dino_dpvo_pure100_tum30_recovery_v1

runner:
  train_script: refocus_vo/scripts/train_dino_dpvo_frontend.sh
  dataset_root: refocus_vo/data/tartanair_v2_raw
  eval_dataset_root: refocus_vo/data/tartanair_v2_converted
  tum_dataset_root: src/dino_slam3/data/tum_rgbd
  dpvo_root: refocus_vo/external/repos/DPVO
  dpvo_weights_path: refocus_vo/external/repos/DPVO/dpvo.pth
  dpvo_config_path: refocus_vo/external/repos/DPVO/config/default.yaml
  train_device: cuda
  legacy_repro: true

sweep:
  no_improve_patience_steps: 1000
  worse_on_both_patience: 2
  min_failure_step: 1000
  required_usable_dev_steps: [500, 1000]
  skip_validation: true
  config_overrides:
    model:
      image_size: [240, 320]
      patch_size: 16
      candidate_pool: 288
      patch_budget: 96
      max_nodes_per_object_ratio: 0.20
      k_mutual_neighbors: 4
      dino_layers: [3, 6, 11]
      dino_name_or_path: facebook/dinov3-vits16-pretrain-lvd1689m
      dino_dtype: bf16
      local_patch_dim: 64
      dpvo_dim: 384
      use_offset_refinement: true
      use_descriptor_bias: false
      descriptor_bias_mode: none
      descriptor_bias_scale: 1.0
      gmap_bias_scale: 1.0
      static_score_weight: 0.35
      quality_floor: 0.05
      native_fraction: 0.0
      dino_fraction: 1.0
      hybrid_grid_rows: 6
      hybrid_grid_cols: 8
      max_dino_per_cell: 1
      dedupe_radius_px: 8.0
      semantic_dedupe_schedule_px: [8.0, 6.0, 4.0, 2.0]
      collect_diagnostics: true
      enable_gradient_branch: false
      gradient_branch_dim: 32
      coverage_grid_rows: 6
      coverage_grid_cols: 8
      enforce_unique_semantic: true
      semantic_backfill_source: dino
      semantic_grid_rows: 6
      semantic_grid_cols: 8
      max_semantic_per_cell: 2
      proposal_decoder_mode: base
      patch_sampler_mode: semantic_grid
      random_backfill_fraction: 0.0
      temporal_memory_mode: none
      temporal_memory_dim: 64
      geometry_score_mode: gradient
      use_register_context: false
      register_context_scale: 0.0
      register_context_target: fused
      dino_unfreeze_blocks: 0
      keep_alive_topk: 0
      survival_bias_scale: 0.0
      track_survival_horizon: 3
      quality_mode: none
      quality_edge_power: 1.0
      quality_insert_threshold: 0.0
      quality_smoothing: 0.0
    training:
      batch_size: 4
      num_workers: 4
      train_steps: 5000
      learning_rate: 0.000003
      weight_decay: 0.000001
      grad_clip: 5.0
      log_every: 50
      eval_every: 500
      device: cuda
      legacy_repro: true
      gram_anchor_start_step: 500
      gram_anchor_sample_tokens: 96
      gram_anchor_downsample_stride: 2
    losses:
      selector_bce: 1.0
      staticness_bce: 0.60
      offset_l1: 0.30
      descriptor_reg: 0.01
      coverage_kl: 0.02
      coverage_uniform_mix: 0.10
      proposal_repulsion: 0.0
      gram_anchor: 0.0
    eval:
      frontend_mode: dino_proposals
      pure100_frontend_mode: dino_proposals
      coverage_gate: 0.95
      secondary_coverage_gate: 0.95
      selection_metric: pure_tum_proxy_score
      selection_mode: pure_only
      collect_dev_diagnostics: true
      write_patch_diagnostics: true
      write_dev_plots: false
      save_best_pure100: true
      save_best_hybrid: false
      run_hybrid_dev_eval: false
      stride: 4
      backend_thresh: 32.0
      dpvo_opts: BUFFER_SIZE=512 PATCHES_PER_FRAME=128 REMOVAL_WINDOW=24 OPTIMIZATION_WINDOW=12 PATCH_LIFETIME=15
      seed_runtime: false
      primary_eval_sequences:
        - freiburg1_xyz
        - freiburg1_desk
        - freiburg1_room
        - freiburg2_xyz
        - freiburg2_desk
        - freiburg2_desk_with_person
        - freiburg3_sitting_xyz
        - freiburg3_cabinet
        - freiburg3_walking_static
      pure100_eval_sequences:
        - freiburg1_xyz
        - freiburg1_desk
        - freiburg1_room
        - freiburg2_xyz
        - freiburg2_desk
        - freiburg2_desk_with_person
        - freiburg3_sitting_xyz
        - freiburg3_cabinet
        - freiburg3_walking_static
      secondary_eval_sequences:
        - freiburg1_room
        - freiburg2_desk_with_person
        - freiburg3_cabinet
        - freiburg3_walking_static

proxy_validation:
  top_k: 8
  datasets:
    tum:
      module: refocus_vo.eval.external_dpvo
      dataset_root: src/dino_slam3/data/tum_rgbd
      sequences:
        - freiburg1_xyz
        - freiburg1_desk
        - freiburg1_room
        - freiburg2_xyz
        - freiburg2_desk
        - freiburg2_desk_with_person
        - freiburg3_sitting_xyz
        - freiburg3_cabinet
        - freiburg3_walking_static
      pressure_sequences:
        - freiburg1_room
        - freiburg2_desk_with_person
        - freiburg3_cabinet
        - freiburg3_walking_static
      max_dt: 0.02
      missing_penalty_m: 3.0
      min_coverage_ok: 0.95
      image_height: 240
      image_width: 320
      stride: 4
      backend_thresh: 32.0
      dpvo_opts: BUFFER_SIZE=512 PATCHES_PER_FRAME=128 REMOVAL_WINDOW=24 OPTIMIZATION_WINDOW=12 PATCH_LIFETIME=15
  baselines:
    - method_id: target_multiscale_32x4_v1_hybrid75_25
      frontend_mode: dino_hybrid
      frontend_config: refocus_vo/runs/eval/tum_rgbd_freiburg123_arch_ratio_ablation_v1/ratio_eval_configs/multiscale_32x4_v1__hybrid75_25.yaml
      frontend_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_focus071_arch5x2_tumwin_sweep_v1_rerun1/train/multiscale_32x4_v1/best_hybrid.pt
    - method_id: dpvo_native
      frontend_mode: dpvo_native
    - method_id: focus071_best_pure100
      frontend_mode: dino_proposals
      frontend_config: refocus_vo/runs/sweeps/dino_dpvo_focus071_lr_only_sweep_v1/generated_train_configs/focus071lr_orig_const3e6_v1.yaml
      frontend_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_focus071_lr_only_sweep_v1/train/focus071lr_orig_const3e6_v1/best_pure100.pt
    - method_id: dino_dpvo_pure100_rescue_v3_ft
      frontend_mode: dino_proposals
      frontend_config: refocus_vo/configs/dino_dpvo_pure100_rescue_v3_ft.yaml
      frontend_checkpoint: refocus_vo/runs/train/dino_dpvo_pure100_rescue_v3_ft/best_pure100.pt
  references:
    tum: target_multiscale_32x4_v1_hybrid75_25
  ranking:
    weights:
      primary_ate: 0.55
      pressure_ate: 0.20
      primary_wins: 0.15
      pressure_wins: 0.10
  gate:
    tum_no_regression_multiplier: 1.10
    tum_pressure_multiplier: 1.10
    tum_proxy_min_wins_vs_dpvo: 6
    tum_pressure_min_wins_vs_dpvo: 0
    require_full_dino_patch_fraction: true
  frozen_baselines:
    tum_per_sequence: refocus_vo/runs/eval/tum_rgbd_freiburg123_dpvo_vs_focus071_v1_rerun6/summary/per_sequence_median.csv

full_benchmark:
  stage1_top_k: 8
  stage1_repeats: 1
  stage2_top_k: 3
  repeats: 5
  stage1_ranking:
    weights:
      tum_ate: 0.65
      avg_wins: 0.20
      per_sequence_wins: 0.15
  final_ranking:
    weights:
      tum_ate: 0.60
      avg_wins: 0.20
      per_sequence_wins: 0.10
      sequence_median_ate: 0.10
  winner_gate:
    average_wins_vs_dpvo_min: 30.0
  datasets:
    tum:
      dataset_root: src/dino_slam3/data/tum_rgbd
  frozen:
    multiscale_benchmark_root: refocus_vo/runs/eval/tum_rgbd_freiburg123_arch_dual_finalists_5x_v1
    multiscale_id_field: finalist_id
    multiscale_method_id: multiscale_32x4_v1_hybrid75_25
    legacy_pure_benchmark_root: refocus_vo/runs/eval/tum_rgbd_freiburg123_dpvo_vs_focus071_v1_rerun6
    legacy_id_field: method
    dpvo_method_id: dpvo_native
    focus071_method_id: focus071_best

