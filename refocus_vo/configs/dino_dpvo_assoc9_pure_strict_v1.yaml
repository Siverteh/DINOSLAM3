method_id: assoc9_pure_strict_v1
feature_type: ASSOC9_PURE_STRICT_V1

model:
  image_size: [240, 320]
  patch_size: 16
  candidate_pool: 288
  patch_budget: 96
  max_nodes_per_object_ratio: 0.20
  k_mutual_neighbors: 4
  dino_layers: [6, 11]
  dino_name_or_path: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_dtype: bf16
  local_patch_dim: 64
  dpvo_dim: 384
  use_offset_refinement: true
  use_descriptor_bias: false
  static_score_weight: 0.35
  quality_floor: 0.05
  track_survival_horizon: 3
  native_fraction: 0.0
  dino_fraction: 1.0
  hybrid_grid_rows: 6
  hybrid_grid_cols: 8
  max_dino_per_cell: 1
  dedupe_radius_px: 8.0
  semantic_dedupe_schedule_px: [8.0, 6.0, 4.0, 2.0]
  collect_diagnostics: true
  enable_gradient_branch: true
  gradient_branch_dim: 32
  coverage_grid_rows: 6
  coverage_grid_cols: 8
  enforce_unique_semantic: true
  semantic_backfill_source: dino
  semantic_grid_rows: 6
  semantic_grid_cols: 8
  max_semantic_per_cell: 2

training:
  batch_size: 4
  num_workers: 4
  train_steps: 5000
  learning_rate: 0.00002
  weight_decay: 0.000001
  grad_clip: 5.0
  log_every: 50
  eval_every: 1000
  max_eval_sequences: 9
  device: cuda

losses:
  selector_bce: 1.0
  staticness_bce: 0.60
  offset_l1: 0.30
  descriptor_reg: 0.01
  coverage_kl: 0.02
  coverage_uniform_mix: 0.10
  proposal_repulsion: 0.0

eval:
  frontend_mode: dino_proposals
  coverage_gate: 0.95
  selection_metric: associated_ate
  save_best_pure100: true
  save_best_hybrid: false
  run_hybrid_dev_eval: false
  dpvo_style_eval: true
  dpvo_style_output: dpvo_style_metrics_summary.csv
  max_dt: 0.02
  missing_penalty_m: 3.0
  stride: 4
  backend_thresh: 32.0
  primary_eval_sequences:
    - freiburg1_xyz
    - freiburg1_desk
    - freiburg1_room
    - freiburg2_xyz
    - freiburg2_desk
    - freiburg2_desk_with_person
    - freiburg3_sitting_xyz
    - freiburg3_cabinet
    - freiburg3_walking_static
  pure100_eval_sequences:
    - freiburg1_xyz
    - freiburg1_desk
    - freiburg1_room
    - freiburg2_xyz
    - freiburg2_desk
    - freiburg2_desk_with_person
    - freiburg3_sitting_xyz
    - freiburg3_cabinet
    - freiburg3_walking_static
  pure100_frontend_mode: dino_proposals
  pure100_model_overrides:
    native_fraction: 0.0
    dino_fraction: 1.0
    enforce_unique_semantic: true
    semantic_backfill_source: dino
    semantic_grid_rows: 6
    semantic_grid_cols: 8
    max_semantic_per_cell: 2
    semantic_dedupe_schedule_px: [8.0, 6.0, 4.0, 2.0]
