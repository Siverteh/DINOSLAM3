name: dino_dpvo_freiburg1_paper_sweep_v1_15k

runner:
  train_script: refocus_vo/scripts/train_dino_dpvo_frontend.sh
  pack_script: refocus_vo/scripts/run_dino_dpvo_freiburg1_paper_fixed96_pack.sh
  dataset_root: refocus_vo/data/tartanair_v2_raw
  eval_dataset_root: refocus_vo/data/tartanair_v2_converted
  tum_dataset_root: src/dino_slam3/data/tum_rgbd
  dpvo_config_path: refocus_vo/external/repos/DPVO/config/default.yaml
  train_device: cuda

sweep:
  no_improve_patience_steps: 3000
  config_overrides:
    training:
      train_steps: 15000
    eval:
      primary_eval_sequences:
        - freiburg1_360
        - freiburg1_desk
        - freiburg1_desk2
        - freiburg1_floor
        - freiburg1_plant
        - freiburg1_room
        - freiburg1_rpy
        - freiburg1_teddy
        - freiburg1_xyz
      pure100_eval_sequences:
        - freiburg1_360
        - freiburg1_desk
        - freiburg1_desk2
        - freiburg1_floor
        - freiburg1_plant
        - freiburg1_room
        - freiburg1_rpy
        - freiburg1_teddy
        - freiburg1_xyz

evaluation:
  coverage_gate: 0.95
  baseline_assoc: 0.089000
  baseline_ate: 0.089000
  sequences:
    - freiburg1_360
    - freiburg1_desk
    - freiburg1_desk2
    - freiburg1_floor
    - freiburg1_plant
    - freiburg1_room
    - freiburg1_rpy
    - freiburg1_teddy
    - freiburg1_xyz
  current_champion:
    run_id: freiburg1_current_best_pure100_v1
    checkpoint: refocus_vo/runs/train/dino_dpvo_final_frontend_raw_v1/best.pt
    config: refocus_vo/configs/dino_dpvo_proposals_100_0_fullcover_fixed96_v1.yaml

runs:
  - run_id: assoc9_anchor_90_10_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_anchor_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/train/dino_dpvo_final_frontend_raw_v1/best.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: {2000: 0.140, 3000: 0.115, 4000: 0.105}
  - run_id: assoc9_geom_95_5_v1
