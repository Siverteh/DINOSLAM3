method_id: dino_dpvo_assoc9_no_gradient_90_10_pure_eval_v1
feature_type: DINO_DPVO_ASSOC9_NO_GRADIENT_90_10_PURE_EVAL_V1

model:
  image_size: [240, 320]
  patch_size: 16
  candidate_pool: 224
  patch_budget: 96
  max_nodes_per_object_ratio: 0.20
  k_mutual_neighbors: 4
  dino_layers: [6, 11]
  dino_name_or_path: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_dtype: bf16
  local_patch_dim: 64
  dpvo_dim: 384
  use_offset_refinement: true
  use_descriptor_bias: false
  static_score_weight: 0.35
  quality_floor: 0.05
  track_survival_horizon: 3
  native_fraction: 0.0
  dino_fraction: 1.0
  hybrid_grid_rows: 6
  hybrid_grid_cols: 8
  max_dino_per_cell: 1
  dedupe_radius_px: 8.0
  collect_diagnostics: true
  enable_gradient_branch: false
  coverage_grid_rows: 6
  coverage_grid_cols: 8
  enforce_unique_semantic: true
  semantic_backfill_source: dino
  semantic_grid_rows: 6
  semantic_grid_cols: 8
  max_semantic_per_cell: 2
  semantic_dedupe_schedule_px: [8.0, 6.0, 4.0, 2.0]

training:
  batch_size: 4
  num_workers: 4
  train_steps: 15000
  learning_rate: 0.00002
  weight_decay: 0.000001
  grad_clip: 5.0
  log_every: 50
  eval_every: 1000
  max_eval_sequences: 9
  device: cuda

losses:
  selector_bce: 1.0
  staticness_bce: 0.5
  offset_l1: 0.25
  descriptor_reg: 0.01
  coverage_kl: 0.02
  coverage_uniform_mix: 0.10
  proposal_repulsion: 0.0

eval:
  frontend_mode: dino_proposals
  coverage_gate: 0.95
  selection_metric: associated_ate
  dpvo_style_eval: true
  dpvo_style_output: dpvo_style_metrics_summary.csv
  max_dt: 0.02
  missing_penalty_m: 3.0
  stride: 4
  backend_thresh: 32.0
  primary_eval_sequences:
    - freiburg1_360
    - freiburg1_desk
    - freiburg1_desk2
    - freiburg1_floor
    - freiburg1_plant
    - freiburg1_room
    - freiburg1_rpy
    - freiburg1_teddy
    - freiburg1_xyz
