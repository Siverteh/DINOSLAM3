    config_overrides:
      model:
        dino_layers: [6, 11]
        native_fraction: 0.80
        dino_fraction: 0.20
        candidate_pool: 256
        max_dino_per_cell: 2

  - run_id: tumwin_densegrid_sem20_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_focus071_lr_only_sweep_v1/train/focus071lr_orig_const3e6_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    config_overrides:
      model:
        native_fraction: 0.80
        dino_fraction: 0.20
        hybrid_grid_rows: 8
        hybrid_grid_cols: 10
        max_dino_per_cell: 2
        dedupe_radius_px: 6.0
      losses:
        coverage_uniform_mix: 0.15

  - run_id: tumwin_repulse_sem20_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_focus071_lr_only_sweep_v1/train/focus071lr_orig_const3e6_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    config_overrides:
      model:
        native_fraction: 0.80
        dino_fraction: 0.20
        candidate_pool: 320
        max_dino_per_cell: 2
        track_survival_horizon: 4
        proposal_repulsion_radius_px: 8.0
        proposal_repulsion_topk: 128
      losses:
        proposal_repulsion: 0.02

  - run_id: tumwin_static_sem20_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
