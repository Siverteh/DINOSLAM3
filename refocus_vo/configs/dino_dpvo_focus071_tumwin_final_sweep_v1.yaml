    init_mode: partial
    expected_eval_mode: pure100
    config_overrides:
      model:
        native_fraction: 0.60
        dino_fraction: 0.40
        dino_layers: [6, 11]
        candidate_pool: 288
        max_dino_per_cell: 3
        dedupe_radius_px: 6.0
        static_score_weight: 0.40
        track_survival_horizon: 4
        proposal_repulsion_radius_px: 8.0
        proposal_repulsion_topk: 160
      losses:
        coverage_uniform_mix: 0.15
        proposal_repulsion: 0.03
