method_id: dino_dpvo_hybrid_90_10_fixed96_v1
feature_type: DINO_DPVO_HYBRID_90_10_FIXED96_V1

model:
  image_size: [240, 320]
  patch_size: 16
  candidate_pool: 192
  patch_budget: 96
  max_nodes_per_object_ratio: 0.20
  k_mutual_neighbors: 4
  dino_layers: [6, 11]
  dino_name_or_path: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_dtype: bf16
  local_patch_dim: 64
  dpvo_dim: 384
  use_offset_refinement: true
  use_descriptor_bias: false
  static_score_weight: 0.35
  quality_floor: 0.05
  track_survival_horizon: 3
  native_fraction: 0.90
  dino_fraction: 0.10
  hybrid_grid_rows: 6
  hybrid_grid_cols: 8
  max_dino_per_cell: 1
  dedupe_radius_px: 8.0
  collect_diagnostics: true
  enable_gradient_branch: true
  gradient_branch_dim: 32

training:
  batch_size: 4
  num_workers: 4
  train_steps: 30000
  learning_rate: 0.00005
  weight_decay: 0.000001
  grad_clip: 5.0
  log_every: 50
  eval_every: 1000
  max_eval_sequences: 8
  device: cuda

losses:
  selector_bce: 1.0
  staticness_bce: 0.5
  offset_l1: 0.25
  descriptor_reg: 0.01
  coverage_kl: 0.02
  coverage_uniform_mix: 0.10

eval:
  frontend_mode: dino_hybrid
  coverage_gate: 0.99
  max_dt: 0.02
  missing_penalty_m: 3.0
  stride: 1
  backend_thresh: 18.0
