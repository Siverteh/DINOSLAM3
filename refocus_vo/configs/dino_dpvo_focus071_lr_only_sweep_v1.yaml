name: dino_dpvo_focus071_lr_only_sweep_v1

runner:
  train_script: refocus_vo/scripts/train_dino_dpvo_frontend.sh
  pack_script: refocus_vo/scripts/run_dino_dpvo_freiburg1_paper_fixed96_pack.sh
  dataset_root: refocus_vo/data/tartanair_v2_raw
  eval_dataset_root: refocus_vo/data/tartanair_v2_converted
  tum_dataset_root: src/dino_slam3/data/tum_rgbd
  dpvo_config_path: refocus_vo/external/repos/DPVO/config/default.yaml
  train_device: cuda
  legacy_repro: true

sweep:
  no_improve_patience_steps: 0
  worse_on_both_patience: 2
  required_usable_dev_steps: [500]
  config_overrides:
    model:
      patch_budget: 96
      use_offset_refinement: true
      use_descriptor_bias: false
      quality_floor: 0.05
      static_score_weight: 0.35
      dino_layers: [3, 6, 11]
      candidate_pool: 224
      native_fraction: 0.90
      dino_fraction: 0.10
      enable_gradient_branch: false
    training:
      batch_size: 4
      weight_decay: 0.000001
      grad_clip: 5.0
      eval_every: 500
      train_steps: 6000
      legacy_repro: true
      learning_rate: 0.000003
    losses:
      selector_bce: 1.0
      staticness_bce: 0.50
      offset_l1: 0.25
      descriptor_reg: 0.01
      coverage_kl: 0.02
      coverage_uniform_mix: 0.10
      proposal_repulsion: 0.0
    eval:
      coverage_gate: 0.95
      secondary_coverage_gate: 0.95
      secondary_assoc_guardrail: 0.060
      selection_metric: associated_ate
      save_best_pure100: true
      save_best_hybrid: false
      run_hybrid_dev_eval: false
      frontend_mode: dino_hybrid
      stride: 4
      backend_thresh: 32.0
      dpvo_opts: BUFFER_SIZE=512 PATCHES_PER_FRAME=128 REMOVAL_WINDOW=24 OPTIMIZATION_WINDOW=12 PATCH_LIFETIME=15
      seed_runtime: false
      primary_eval_sequences:
        - freiburg1_360
        - freiburg1_desk
        - freiburg1_desk2
        - freiburg1_floor
        - freiburg1_plant
        - freiburg1_room
        - freiburg1_rpy
        - freiburg1_teddy
        - freiburg1_xyz
      pure100_eval_sequences:
        - freiburg1_360
        - freiburg1_desk
        - freiburg1_desk2
        - freiburg1_floor
        - freiburg1_plant
        - freiburg1_room
        - freiburg1_rpy
        - freiburg1_teddy
        - freiburg1_xyz
      pure100_frontend_mode: dino_proposals
      pure100_model_overrides:
        native_fraction: 0.0
        dino_fraction: 1.0
        enforce_unique_semantic: true
        semantic_backfill_source: dino
        semantic_grid_rows: 6
        semantic_grid_cols: 8
        max_semantic_per_cell: 2
        semantic_dedupe_schedule_px: [8.0, 6.0, 4.0, 2.0]
      pure100_eval_overrides:
        stride: 4
        backend_thresh: 32.0
        dpvo_opts: BUFFER_SIZE=512 PATCHES_PER_FRAME=128 REMOVAL_WINDOW=24 OPTIMIZATION_WINDOW=12 PATCH_LIFETIME=15
        seed_runtime: false
      secondary_from_primary_exclude_sequences:
        - freiburg1_room

evaluation:
  coverage_gate: 0.95
  secondary_coverage_gate: 0.95
  secondary_assoc_guardrail: 0.060
  secondary_label: No-room paper
  baseline_assoc: 0.078713
  baseline_ate: 0.078713
  lowtex_reference_assoc: 0.043551
  top_dev_limit: 6
  sequences:
    - freiburg1_360
    - freiburg1_desk
    - freiburg1_desk2
    - freiburg1_floor
    - freiburg1_plant
    - freiburg1_room
    - freiburg1_rpy
    - freiburg1_teddy
    - freiburg1_xyz
  secondary_from_primary_exclude_sequences:
    - freiburg1_room
  pack_env:
    DPVO_STRIDE: "4"
    DPVO_BACKEND_THRESH: "32.0"
    DPVO_OPTS: BUFFER_SIZE=512 PATCHES_PER_FRAME=128 REMOVAL_WINDOW=24 OPTIMIZATION_WINDOW=12 PATCH_LIFETIME=15
  current_champion:
    run_id: current_paper_runtime_winner
    checkpoint: refocus_vo/runs/sweeps/dino_dpvo_freiburg1_paper_sweep_v2_wild15k/train/paperv2_three_layer_no_gradient_90_10_v1/best_pure100.pt
    config: refocus_vo/runs/sweeps/dino_dpvo_freiburg1_paper_sweep_v2_wild15k/pack_eval_configs/paperv2_three_layer_no_gradient_90_10_v1.yaml
    kind: current_paper_runtime_winner

runs:
  - run_id: focus071lr_orig_const3e6_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: &focus071_lr_thresholds
      500: {paper_assoc: 0.1150, lowtex_assoc: 0.0650}
      1000: {paper_assoc: 0.0950, lowtex_assoc: 0.0550}
      1500: {paper_assoc: 0.0850, lowtex_assoc: 0.0505}
      2000: {paper_assoc: 0.0800, lowtex_assoc: 0.0485}
    config_overrides:
      training:
        learning_rate: 0.000003

  - run_id: focus071lr_const2e6_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000002

  - run_id: focus071lr_const4e6_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000004

  - run_id: focus071lr_const5e6_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000005

  - run_id: focus071lr_linear_decay_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000004
        lr_schedule:
          type: linear_decay
          min_lr_scale: 0.25

  - run_id: focus071lr_cosine_decay_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000004
        lr_schedule:
          type: cosine_decay
          min_lr_scale: 0.20

  - run_id: focus071lr_warmup_cosine_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000004
        lr_schedule:
          type: warmup_cosine
          warmup_steps: 1000
          warmup_start_scale: 0.40
          min_lr_scale: 0.25

  - run_id: focus071lr_step_decay_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000004
        lr_schedule:
          type: step_decay
          step_size_steps: 1000
          gamma: 0.70
          min_lr_scale: 0.20

  - run_id: focus071lr_triangular_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000003
        lr_schedule:
          type: triangular
          start_scale: 0.75
          peak_scale: 1.60
          peak_step: 1500
          end_scale: 0.50

  - run_id: focus071lr_cosine_restart_v1
    config: refocus_vo/configs/dino_dpvo_assoc9_three_layer_90_10_v1.yaml
    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/sweeps/dino_dpvo_paper_lowtex_dual_sweep_v1_rerun1/train/dual_broad_three_layer_no_grad_v1/best_pure100.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: *focus071_lr_thresholds
    config_overrides:
      training:
        learning_rate: 0.000003
        lr_schedule:
          type: cosine_restart
          cycle_steps: 1500
          min_lr_scale: 0.50
