    subset_config: refocus_vo/configs/tartanair_subset_raw_8env_x4_v1.yaml
    init_checkpoint: refocus_vo/runs/train/dino_dpvo_final_frontend_raw_v1/best.pt
    init_mode: partial
    expected_eval_mode: pure100
    stop_thresholds: {2000: 0.085, 3000: 0.075, 4000: 0.071}
