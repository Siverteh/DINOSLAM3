method_id: dino_dpvo_transfer_75_25_3611_v1
feature_type: DINO_DPVO_TRANSFER_75_25_3611_V1

model:
  image_size: [240, 320]
  patch_size: 16
  candidate_pool: 288
  patch_budget: 96
  max_nodes_per_object_ratio: 0.20
  k_mutual_neighbors: 4
  dino_layers: [3, 6, 11]
  dino_name_or_path: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_dtype: bf16
  local_patch_dim: 64
  dpvo_dim: 384
  use_offset_refinement: true
  use_descriptor_bias: false
  static_score_weight: 0.35
  quality_floor: 0.05
  track_survival_horizon: 3
  native_fraction: 0.75
  dino_fraction: 0.25
  hybrid_grid_rows: 6
  hybrid_grid_cols: 8
  max_dino_per_cell: 2
  dedupe_radius_px: 8.0
  semantic_dedupe_schedule_px: [8.0, 6.0, 4.0]
  collect_diagnostics: true
  enable_gradient_branch: true
  gradient_branch_dim: 32
  coverage_grid_rows: 6
  coverage_grid_cols: 8

training:
  batch_size: 4
  num_workers: 4
  train_steps: 8000
  learning_rate: 0.00003
  weight_decay: 0.000001
  grad_clip: 5.0
  log_every: 50
  eval_every: 500
  max_eval_sequences: 8
  device: cuda

losses:
  selector_bce: 1.0
  staticness_bce: 0.45
  offset_l1: 0.35
  descriptor_reg: 0.01
  coverage_kl: 0.015
  coverage_uniform_mix: 0.08
  proposal_repulsion: 0.0

eval:
  frontend_mode: dino_hybrid
  coverage_gate: 0.99
  selection_metric: associated_ate
  save_best_pure100: true
  save_best_hybrid: true
  run_hybrid_dev_eval: true
  dpvo_style_eval: true
  dpvo_style_output: dpvo_style_metrics_summary.csv
  max_dt: 0.02
  missing_penalty_m: 3.0
  stride: 1
  backend_thresh: 18.0
  primary_eval_sequences:
    - freiburg1_desk
    - freiburg1_plant
    - freiburg3_large_cabinet
    - freiburg3_walking_static
  pure100_frontend_mode: dino_proposals
  pure100_model_overrides:
    native_fraction: 0.0
    dino_fraction: 1.0
    enforce_unique_semantic: true
    semantic_backfill_source: dino
    semantic_grid_rows: 6
    semantic_grid_cols: 8
    max_semantic_per_cell: 2
    semantic_dedupe_schedule_px: [8.0, 6.0, 4.0]
  hybrid_frontend_mode: dino_hybrid
  hybrid_model_overrides:
    native_fraction: 0.75
    dino_fraction: 0.25
    hybrid_grid_rows: 6
    hybrid_grid_cols: 8
    max_dino_per_cell: 2
    dedupe_radius_px: 8.0
